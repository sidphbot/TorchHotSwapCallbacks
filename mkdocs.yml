site_name: hotcb
repo_url: https://github.com/sidphbot/hotcb
repo_name: sidphbot/hotcb

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2
            members_order: source
            inherited_members: true
            merge_init_into_class: true
            docstring_section_style: spacy
            show_root_heading: true
            show_root_full_path: false

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - Features:
      - Autopilot: autopilot.md
      - Policy Packs: policy_packs.md
      - Continuation Tuning: features/continuation.md
      - Guarantee Envelope: guarantee_envelope.md
      - Scenarios: scenarios.md
  - Results:
      - Continuation Results: results/continuation.md
      - Policy Improvements: results/policies.md
  - CLI Reference: cli.md
  - Formats: formats.md
  - Replay: replay.md
  - Modules:
      - Callbacks (cb): modules/cb.md
      - Optimizer (opt): modules/hotopt.md
      - Loss (loss): modules/hotloss.md
  - API:
      - Overview: api/index.md
      - Controller: api/controller.md
      - Adapters: api/adapters.md
      - Callbacks: api/callbacks.md
      - Config: api/config.md
      - CLI: api/cli.md
      - Loader: api/loader.md
  - Examples:
      - CLI Walkthrough: examples/cli_walkthrough.md
